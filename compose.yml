services:
  openalice:
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.202}
        CODEX_VERSION: ${CODEX_VERSION:-0.144.1}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.17.18}
        PI_VERSION: ${PI_VERSION:-0.83.0}
    image: ${OPENALICE_IMAGE:-openalice:local}
    container_name: ${CONTAINER_NAME:-openalice}
    restart: ${RESTART_POLICY:-unless-stopped}
    stop_grace_period: ${STOP_GRACE_PERIOD:-30s}
    ports:
      # host-bind : host-port : container-port
      - "${HOST_BIND_IP:-127.0.0.1}:${HOST_PORT:-47331}:${OPENALICE_WEB_PORT:-47331}"
    environment:
      OPENALICE_WEB_PORT: ${OPENALICE_WEB_PORT:-47331}
      OPENALICE_MCP_PORT: ${OPENALICE_MCP_PORT:-47332}
      OPENALICE_UTA_PORT: ${OPENALICE_UTA_PORT:-47333}
      OPENALICE_CONNECTOR_PORT: ${OPENALICE_CONNECTOR_PORT:-47334}
      OPENALICE_BIND_HOST: ${OPENALICE_BIND_HOST:-0.0.0.0}
      TZ: ${TZ:-Europe/Dublin}
      # Optional — uncomment in .env and here if you need them
      # OPENALICE_TRUSTED_PROXIES: ${OPENALICE_TRUSTED_PROXIES}
      # OPENALICE_TRADING_MODE: ${OPENALICE_TRADING_MODE}
      # OPENALICE_BROKER_PACK_AUTO_UPDATE: ${OPENALICE_BROKER_PACK_AUTO_UPDATE}
    volumes:
      - openalice-data:/data
      # Optional: reuse host CLI auth (don't do this on a shared server)
      # - ${HOME}/.claude:/data/home/.claude:ro
      # - ${HOME}/.codex:/data/home/.codex:ro
    stdin_open: true
    tty: true
    labels:
      - "dockhand.update=false"
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

volumes:
  openalice-data:
